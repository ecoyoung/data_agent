services:
  data-agent:
    build:
      context: .
    image: data-agent:local
    container_name: data-agent
    env_file:
      - .env
    ports:
      - "8010:8000"
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: data-agent-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    env_file:
      - .env
    depends_on:
      data-agent:
        condition: service_healthy
    restart: unless-stopped
